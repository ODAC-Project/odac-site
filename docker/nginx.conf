# SPDX-License-Identifier: Apache-2.0
# odac.tune.audio: nginx in front of PHP-FPM.
# TLS (certbot) is terminated by the host's nginx, which proxies here.

map $http_x_forwarded_proto $odac_https {
    default "";
    https   on;
}

server {
    listen 80;
    server_name odac.tune.audio;
    root /var/www/odac/public;
    index index.php;

    # Client address: the host's TLS nginx is the only trusted hop (named,
    # never 0.0.0.0/0). PHP then sees the client in REMOTE_ADDR and needs no
    # trusted proxy of its own (ODAC_TRUSTED_PROXIES stays empty).
    set_real_ip_from 172.30.57.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # The artifact is PRE-COMPRESSED by the application (Content-Encoding:
    # gzip): nginx does not compress a response that already has one.
    # For the rest (pages, assets), gzip on — and gzip_types MUST be set:
    # the Debian default leaves it commented, and then JSON is sent raw.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    # latest.json (~135 bytes) stays uncompressed, so its ETag stays strong.
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/x-ndjson;

    # Built assets carry a hash in their name.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass odac-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $odac_https;
        # The artifact is a few hundred kB compressed: no buffering to disk.
        fastcgi_buffers 16 64k;
        fastcgi_buffer_size 64k;
    }

    location ~ /\. {
        deny all;
    }
}
